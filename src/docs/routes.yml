openapi: 3.0.0
info:
  title: Ajeitaí Backend API
  description: Documentação das rotas do backend Ajeitaí (Atualizado Fase 6).
  version: 1.0.0

servers:
  - url: http://localhost:3333
    description: Servidor Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # --- AUTENTICAÇÃO (BETTER-AUTH) ---
  /api/auth/sign-in/email:
    post:
      tags: [Autenticação]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Sucesso (Sessão criada via cookie/token)
  
  /api/auth/sign-out:
    post:
      tags: [Autenticação]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessão encerrada

  # --- USUÁRIOS ---
  /clientes:
    post:
      tags: [Usuários]
      summary: Cadastrar Cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                image:
                  type: string
                password:
                  type: string
                cpf:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Cliente cadastrado com sucesso

  /prestadores:
    post:
      tags: [Usuários]
      summary: Cadastrar Prestador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                cpf:
                  type: string
                image:
                  type: string
                phone:
                  type: string
                birthDate:
                  type: string
                  format: date-time
                description:
                  type: string
                  minLength: 100
      responses:
        "201":
          description: Prestador cadastrado com sucesso

  # --- SERVIÇOS ---
  /servicos:
    get:
      tags: [Serviços]
      summary: Listar Serviços Disponíveis
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Lista de serviços
    post:
      tags: [Serviços]
      summary: Criar novo serviço
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                images_url:
                  type: array
                  items:
                    type: string
                categoryIds:
                  type: array
                  items:
                    type: string
                city:
                  type: string
                neighborhood:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        "201":
          description: Serviço criado

  /servicos/me:
    get:
      tags: [Serviços]
      summary: Listar todos os serviços criados pelo usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de serviços criados pelo usuário (ordenados por atualização mais recente)

  /servicos/{id}:
    get:
      tags: [Serviços]
      summary: Detalhes de um serviço específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do serviço

  # --- ORÇAMENTOS ---
  /orcamentos/{serviceId}:
    get:
      tags: [Orçamentos]
      summary: Listar orçamentos de um serviço
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de orçamentos

  /orcamentos:
    post:
      tags: [Orçamentos]
      summary: Enviar novo orçamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: string
                price:
                  type: number
                description:
                  type: string
                estimatedDate:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Orçamento enviado

  /orcamentos/{id}/contra-proposta:
    patch:
      tags: [Orçamentos]
      summary: Enviar contra-proposta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                description:
                  type: string
                estimatedDate:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Contra-proposta enviada

  /orcamentos/{id}/aceitar:
    patch:
      tags: [Orçamentos]
      summary: Cliente ou Prestador aceita o orçamento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orçamento aceito

  # --- MENSAGENS ---
  /mensagens:
    post:
      tags: [Mensagens]
      summary: Enviar mensagem no chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budgetId:
                  type: string
                text:
                  type: string
                imageUrl:
                  type: string
      responses:
        "201":
          description: Mensagem enviada

  /mensagens/{budgetId}:
    get:
      tags: [Mensagens]
      summary: Listar mensagens do chat
      security:
        - bearerAuth: []
      parameters:
        - name: budgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de mensagens

  # --- PAGAMENTOS ---
  /pagamentos:
    post:
      tags: [Pagamentos]
      summary: Realizar pagamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budgetId:
                  type: string
                method:
                  type: string
      responses:
        "201":
          description: Pagamento realizado

  # --- AVALIAÇÕES ---
  /avaliacoes:
    post:
      tags: [Avaliações]
      summary: Enviar avaliação
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: string
                rating:
                  type: number
                comment:
                  type: string
      responses:
        "201":
          description: Avaliação salva

  # --- ENDEREÇOS ---
  /enderecos:
    post:
      tags: [Endereços]
      summary: Criar novo endereço
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rua:
                  type: string
                numero:
                  type: string
                complemento:
                  type: string
                ponto_de_referencia:
                  type: string
                cep:
                  type: string
                cidade:
                  type: string
                estado:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        "201":
          description: Endereço criado com sucesso
    get:
      tags: [Endereços]
      summary: Listar endereços do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de endereços
          
  /enderecos/{id}:
    get:
      tags: [Endereços]
      summary: Buscar um endereço específico por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do endereço
    delete:
      tags: [Endereços]
      summary: Deletar um endereço
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Endereço deletado com sucesso
          
  /enderecos/{id}/principal:
    patch:
      tags: [Endereços]
      summary: Definir endereço como principal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Endereço atualizado como principal
